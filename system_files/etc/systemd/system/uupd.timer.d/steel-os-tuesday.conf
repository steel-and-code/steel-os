# Steel OS (STEEL-27): automatic updates run every Tuesday, Windows-style.
#
# Bazzite's uupd.timer runs the whole-system update (image, Flatpaks, firmware)
# every day at 04:00. This drop-in keeps everything else Bazzite set
# (Persistent=true so a machine that was off catches up at the next boot, and
# a 15-minute random delay) and changes the day and time.
#
# Midnight, not Bazzite's 4 am: night restarts are allowed from 2 to 5 am,
# so a slow download gets two hours to finish first and the PC restarts the
# same night (T's laptop, 2026-11-03: downloading from 4 am left too
# little time and it stayed on the old version).
#
# The empty OnCalendar= line clears Bazzite's daily schedule before ours is
# added; without it both schedules would apply.
[Timer]
OnCalendar=
OnCalendar=Tue *-*-* 00:00:00
