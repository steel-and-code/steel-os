# Steel OS: Firefox starts straight on the page it was asked to open, with no
# welcome tour, terms box or "make Firefox your default" bar. On the installer
# USB every start is Firefox's first, and its welcome screen held up the
# installer (endless "Initializing...") until someone clicked Continue.
#
# The policies live in /etc/firefox/policies/policies.json, which Firefox
# installed as a system package reads (the installer's own Firefox). The
# Flathub Firefox cannot see /etc, so the same file is copied to where it
# looks for system settings (its org.mozilla.firefox.systemconfig extension).
# Copied again at every start, so a change in a new Steel OS version arrives.
d  /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64/stable/policies 0755 root root -
C+ /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64/stable/policies/policies.json - - - - /etc/firefox/policies/policies.json
