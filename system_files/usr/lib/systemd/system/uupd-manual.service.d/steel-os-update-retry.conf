# Steel OS: before the updater's own check, set up a version that was
# downloaded but lost because the PC went off without shutting down. Without
# this the updater says "No changes" and never takes that version again. See
# /usr/libexec/steel-os-update-retry. The "-" means a failure here never stops
# the update itself.
[Service]
ExecStartPre=-/usr/libexec/steel-os-update-retry
