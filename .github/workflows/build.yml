---
name: Build container image
on:
  pull_request:
    branches:
      - master
    paths-ignore:
      # Docs-only changes do not change the OS, so they do not rebuild it.
      - '*.md'
      - 'docs/**'
  # The daily rebuild on Bazzite's newest base is .github/workflows/daily-rebuild.yml:
  # it records the rebuild on master (so the version counts up) and starts this.
  push:
    branches:
      - master
    paths-ignore:
      # Docs-only changes do not change the OS, so they do not rebuild it.
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  # A new commit replaces an older check on the same pull request, but a
  # master build is never canceled: it finishes and publishes, and the next
  # master build waits its turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_push:
    name: Build and push ${{ matrix.image_name }}
    runs-on: ubuntu-26.04
    # Three editions from one recipe (STEEL-30). A PC is moved to the right one
    # at first boot by /usr/libexec/steel-os-graphics-check.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: steel-os                # AMD and Intel graphics
            base_image: ghcr.io/ublue-os/bazzite:stable
          - image_name: steel-os-nvidia         # NVIDIA RTX and GTX 16 series, open driver
            base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
          - image_name: steel-os-nvidia-legacy  # NVIDIA GTX 900 and 1000 series
            base_image: ghcr.io/ublue-os/bazzite-nvidia:stable
    env:
      IMAGE_NAME: ${{ matrix.image_name }}
      BASE_IMAGE: ${{ matrix.base_image }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the version's last number counts merges since VERSION changed.
          fetch-depth: 0

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        # Rechunking only makes downloads smaller for users. Pull request checks
        # are never published, so they skip it and finish about 10 minutes sooner.
        if: github.event_name != 'pull_request'
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tags PCs follow ("latest", "stable") are pushed last, after the
      # image is signed: a PC that updated in the minute between the push and
      # the signature got "a signature was required, but no signature exists"
      # and its update failed (T's wife's laptop, STEEL-87, 2026-10-20).
      # Signatures are stored by digest, so once the first tag is signed, the
      # moving tags verify the moment they appear.
      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          moving=""
          for tag in ${ALIAS_TAGS}; do
            case "$tag" in
              latest|stable|testing|unstable) moving="$moving $tag"; continue ;;
            esac
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done
          [[ -s /tmp/digestfile ]] || { echo "no dated tag was pushed; the tag list is: ${ALIAS_TAGS}" >&2; exit 1; }

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT
          echo "moving_tags=${moving}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}


      # Steel OS (STEEL-47): PCs refuse any image not signed with this key, so
      # check the signature just made with the public key they use. A failure
      # here means installed PCs would refuse this update.
      - name: Publish the tags PCs follow
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          MOVING_TAGS: ${{ steps.push-image.outputs.moving_tags }}
        run: |
          set -euox pipefail
          for tag in ${MOVING_TAGS}; do
            podman push ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

      - name: Verify the signature
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign verify --key cosign.pub --insecure-ignore-tlog=true \
            ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST} > /dev/null
          echo "Signature verified with cosign.pub for ${IMAGE_NAME}@${DIGEST}"
