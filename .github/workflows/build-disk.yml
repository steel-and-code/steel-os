---
# Steel OS (STEEL-35, STEEL-50): build the installer ISO.
#
# Same method as Bazzite's own ISO (ublue-os/bazzite .github/workflows/build_iso.yml):
# a live KDE desktop made from our image, with Fedora's web installer
# (Anaconda WebUI) on top, branded Steel OS, built by Titanoboa.
# The installer/ folder holds the live-session recipe.
#
# Runs by itself after every successful master image build, and uploads the
# installer to downloads.steel-os.org (same address each time, so the newest
# installer replaces the previous one). Docs-only merges don't build an image,
# so they don't build an installer either.
# Can still be run by hand from the Actions tab: "Build disk images" > Run
# workflow (tick "Upload to S3" to publish, otherwise it's a test artifact).
name: Build disk images

on:
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3 (downloads.steel-os.org)"
        required: false
        default: false
        type: boolean
      version:
        description: "Name used in the file name (the version is inside the installer and in its record)"
        required: false
        default: "preview"
        type: string

env:
  IMAGE_REF: "ghcr.io/steel-and-code/steel-os:latest"

# One installer build at a time. A build that has started always finishes;
# if several merges land meanwhile, only the newest waits its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build installer ISO
    # Automatic runs only after an image build on master that succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      # Same as Bazzite: the live image and the image it installs are large,
      # so podman's storage goes on a compressed btrfs loop file.
      - name: Mount container storage on btrfs
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true

      # GitHub's Ubuntu 26.04 runners load an AppArmor profile that disarms
      # bwrap, the sandbox the image builder uses (PR #30). The runner is
      # thrown away after the job, so unloading it here is safe.
      - name: Allow the image builder's sandbox to mount (AppArmor)
        shell: bash
        run: |
          set -x
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge whose image build triggered this run, not whatever
          # master is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the release notes list every version since VERSION changed.
          fetch-depth: 0

      # Each image build also publishes the image under names that include the
      # commit. Use that exact image, so this installer is the version of the merge that
      # triggered it (T, 2026-10-18: when merges land quickly, taking
      # "latest" skipped numbers and labeled builds with a later merge).
      # Locally it is tagged "latest" again, because the installer tells the
      # installed PC to follow the tag it was built from: installed PCs must
      # keep following :latest for their updates.
      - name: Use this merge's image
        shell: bash
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUILT: ${{ github.event.workflow_run.created_at || '' }}
        run: |
          set -euo pipefail
          repo="${IMAGE_REF%:*}"
          # The image build publishes several names for each merge
          # (<date>-<commit>, latest-<date>-<commit>, latest-<commit>), and
          # they are not always the same file: only one is signed, and
          # Steel OS refuses unsigned images. Take the first name whose image
          # has a signature (a sha256-<digest>.sig entry next to it).
          day="$(date -u -d "${BUILT:-now}" +%Y%m%d)"
          next="$(date -u -d "${BUILT:-now} + 1 day" +%Y%m%d)"
          found=""
          for n in 7 8 9 10 11 12; do
            c="${SHA:0:$n}"
            for tag in "${day}-${c}" "${next}-${c}" "latest-${day}-${c}" "latest-${next}-${c}" "latest-${c}"; do
              digest="$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${repo}:${tag}" 2>/dev/null || true)"
              [[ -n "$digest" ]] || continue
              if skopeo inspect --raw "docker://${repo}:${digest/:/-}.sig" >/dev/null 2>&1; then
                found="${repo}:${tag}"
                echo "Using $found ($digest, signed)"
                break 2
              fi
              echo "$tag ($digest) is not signed; trying the next name"
            done
          done
          if [[ -n "$found" ]]; then
            sudo podman pull -q "$found"
            sudo podman tag "$found" "$IMAGE_REF"
            echo "PAYLOAD=$found" >> "$GITHUB_ENV"
          else
            echo "::warning::No signed image found for ${SHA:0:7}; using the newest image instead"
            sudo podman pull -q "$IMAGE_REF"
            echo "PAYLOAD=$IMAGE_REF" >> "$GITHUB_ENV"
          fi
          echo "COMMIT=$SHA" >> "$GITHUB_ENV"

      - name: Build the live session image
        run: |
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --pull=never \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${IMAGE_REF}" \
            --build-arg INSTALL_IMAGE_PAYLOAD="${PAYLOAD}" \
            --build-arg INSTALL_IMAGE_TAG="${IMAGE_REF}" \
            -t localhost/payload:latest installer/

      - name: Build the ISO
        id: build
        uses: Zeglius/titanoboa@7737f4748458252ac827dca14b3d6dd09298472a # revamp-pr, as used by Bazzite
        with:
          image-ref: localhost/payload:latest
          iso-dest: steel-os-${{ inputs.version || 'preview' }}-x86_64.iso

      - name: Checksum
        id: files
        shell: bash
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/upload"
          mkdir -p "$OUT"
          # The build number and version live inside the image
          # (/usr/share/steel-os/); labels don't survive rechunking. The image
          # is already pulled.
          build="$(sudo podman run --rm --entrypoint cat "${IMAGE_REF}" /usr/share/steel-os/build 2>/dev/null || echo unknown)"
          version="$(sudo podman run --rm --entrypoint cat "${IMAGE_REF}" /usr/share/steel-os/version 2>/dev/null || echo unknown)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          # The file is named by its version: steel-os-0.5.3-x86_64.iso (T).
          if [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            name="steel-os-${version}-x86_64.iso"
          else
            name="$(basename "$ISO_PATH")"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # What changed in each version, for steel-os.org/preview (T,
          # 2026-10-18): one entry per merge, with its pull request title.
          python3 .github/scripts/release-notes.py "$RUNNER_TEMP/release-notes.json" "$version"
          echo "notes=$RUNNER_TEMP/release-notes.json" >> "$GITHUB_OUTPUT"
          mv "$ISO_PATH" "$OUT/$name"
          ( cd "$OUT" && sha256sum "$name" > "$name.sha256" )
          # Which Steel OS image this installer contains (STEEL-57). Installed
          # PCs still follow ${IMAGE_REF} for updates; this records the exact
          # version the installer was built from.
          digest="$(sudo podman image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_REF}" 2>/dev/null || echo unknown)"
          printf 'installer: %s\nversion: %s\nimage: %s\nimage digest: %s\nbuild: %s\nbuilt: %s\ncommit: %s\n' \
            "$name" "$version" "${IMAGE_REF}" "$digest" "$build" "$(date -u +%Y-%m-%dT%H:%MZ)" "${COMMIT:-$GITHUB_SHA}" > "$OUT/$name.image.txt"
          cat "$OUT/$name.image.txt"
          cat "$OUT/$name.image.txt" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$OUT"
          cat "$OUT"/*.sha256
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'

      - name: Sign the ISO
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          OUT: ${{ steps.files.outputs.dir }}
        run: |
          for iso in "$OUT"/*.iso; do
            cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY "$iso" --output-signature "${iso}.sig"
          done

      # Every installer, automatic or by hand, is also kept on GitHub for 90
      # days (the run's Artifacts), so steel-os.org/download can point to older
      # builds. downloads.steel-os.org keeps only the newest and the one before.
      - name: Upload to job artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The version is in the name, so steel-os.org/download can list it.
          name: steel-os-installer-${{ steps.files.outputs.version }}
          path: ${{ steps.files.outputs.dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: true

      - name: Upload to S3
        id: upload
        if: github.event_name == 'workflow_run' || inputs.upload-to-s3 == true
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # downloads.steel-os.org is Cloudflare R2. With a generic provider rclone
          # makes calls R2 doesn't support ("NotImplemented") and only succeeds on
          # a retry.
          RCLONE_CONFIG_S3_PROVIDER: Cloudflare
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.files.outputs.dir }}
          NAME: ${{ steps.files.outputs.name }}
          VERSION: ${{ steps.files.outputs.version }}
          BUILD: ${{ steps.files.outputs.build }}
          NOTES: ${{ steps.files.outputs.notes }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          # Two builds at most (T): the newest and the one before. Each
          # installer is uploaded once, under its own name
          # (steel-os-0.5.4-x86_64.iso), and latest.json says which is which.
          # steel-os.org/get/preview and /get/previous read latest.json and
          # redirect, so the website never changes, the browser saves the file
          # with its version, and nothing is copied inside the bucket (that
          # copy failed on Cloudflare R2 and took up to 15 minutes, T,
          # 2026-10-18). Older files go only after the new ones and latest.json
          # are up, so the download link never breaks. shield/ (Steel Shield's
          # threat list, STEEL-60) is never touched.
          B="${{ secrets.S3_BUCKET_NAME }}"
          rclone copy --s3-no-check-bucket --retries 5 "$SOURCE_DIR" "S3:$B"

          old="$(rclone cat "S3:$B/latest.json" 2>/dev/null | jq -r '.current // empty' 2>/dev/null || true)"
          # The version that was current before this upload: a rebuild keeps
          # the version (only the build date moves), and is not announced.
          echo "prev_version=$(rclone cat "S3:$B/latest.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          if [[ -z "$old" ]]; then
            # First run with latest.json: the installer before used the old fixed name.
            old=steel-os-preview-x86_64.iso
          elif [[ "$old" == "$NAME" ]]; then
            # The same build uploaded again: keep the previous one as it was.
            old="$(rclone cat "S3:$B/latest.json" | jq -r '.previous // empty')"
          fi
          jq -n --arg c "$NAME" --arg p "$old" --arg v "$VERSION" --arg b "$BUILD" --arg t "$(date -u +%Y-%m-%dT%H:%MZ)" \
            '{current: $c, previous: $p, version: $v, build: $b, updated: $t}' > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
          rclone copyto --s3-no-check-bucket --retries 5 \
            --header-upload "Cache-Control: no-cache" \
            "$RUNNER_TEMP/latest.json" "S3:$B/latest.json"

          rclone copyto --s3-no-check-bucket --retries 5             --header-upload "Cache-Control: no-cache"             "$NOTES" "S3:$B/release-notes.json"

          # Tiny files Steel Shield fetches as count-only pings (a scam
          # reported, a threat caught, a sample shared, a standalone install's
          # first start) and Steel OS PCs fetch for the weekly check-in; the
          # website counts those fetches like it counts installer downloads.
          # Never cached, so every ping reaches R2.
          for p in scam-reported threat-caught sample-shared shield-installed pc-new pc-active; do
            printf 'ok\n' > "$RUNNER_TEMP/$p"
            rclone copyto --s3-no-check-bucket --retries 5 \
              --header-upload "Cache-Control: no-store" "$RUNNER_TEMP/$p" "S3:$B/ping/$p"
          done

          rclone lsf -R --files-only --exclude "shield/**" "S3:$B" | while read -r f; do
            case "$f" in
              latest.json|release-notes.json|ping/*|"$NAME"|"$NAME".*|"$old"|"$old".*) ;;
              *) echo "Removing old file $f"; rclone deletefile --retries 5 "S3:$B/$f" ;;
            esac
          done
          rclone rmdirs --leave-root "S3:$B" --exclude "shield/**" 2>/dev/null || true
          echo "Kept: $NAME (newest) and $old (the build before)"
          rclone lsl "S3:$B"

      - name: Announce on Discord
        # One post in the Steel OS server's #announcements for every new
        # installer. Needs the DISCORD_ANNOUNCE_WEBHOOK secret (in Discord:
        # Edit #announcements > Integrations > Webhooks > New Webhook > Copy
        # Webhook URL; in GitHub: Settings > Secrets and variables > Actions).
        # Without it this step says so and does nothing.
        # A rebuild of the same version (newest Fedora and Bazzite updates,
        # nothing changed in Steel OS) is not announced.
        if: (github.event_name == 'workflow_run' || inputs.upload-to-s3 == true) && success() && steps.upload.outputs.prev_version != steps.files.outputs.version
        shell: bash
        env:
          HOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          VERSION: ${{ steps.files.outputs.version }}
          NOTES: ${{ steps.files.outputs.notes }}
        run: |
          if [[ -z "$HOOK" ]]; then
            echo "No DISCORD_ANNOUNCE_WEBHOOK secret; not announcing."
            exit 0
          fi
          python3 - "$NOTES" "$VERSION" <<'PYEOF'
          import json, os, sys, urllib.request
          notes, version = json.load(open(sys.argv[1])), sys.argv[2]
          cur = next((v for v in notes.get("versions", []) if v.get("version") == version), {})
          title = cur.get("title", "")
          body = (f"**Steel OS {version}** is out."
                  + (f"\nWhat changed: {title}" if title else "")
                  + "\nInstalled PCs get it with the next update (Portal > Update now, or by itself overnight)."
                  + "\nNew installer: <https://steel-os.org/get/preview> · everything that changed: <https://steel-os.org/preview>")
          data = json.dumps({"content": body, "username": "Steel OS", "allowed_mentions": {"parse": []}}).encode()
          req = urllib.request.Request(os.environ["HOOK"], data=data,
                                       headers={"Content-Type": "application/json", "User-Agent": "steel-os-build"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("Announced on Discord:", r.status)
          except Exception as e:  # noqa: BLE001
              print("Discord did not take the announcement:", e)
          PYEOF
